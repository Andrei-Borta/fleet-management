name: Feature / task
description: A unit of work for the backlog
labels: []
body:
  - type: input
    id: story
    attributes:
      label: User story / parent
      description: "Part of which [Story] issue? For a new story: As a <role>, I want <goal> so that <benefit>."
      placeholder: "Part of #45"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ] Tests: pytest for service functions / Playwright spec for UI
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Depends on
      placeholder: "#12, #15"
