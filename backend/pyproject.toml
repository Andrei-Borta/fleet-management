[project]
name = "fleet-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
include = ["app/modules/*/service.py"]

[tool.coverage.report]
# Empty service files (skeleton) are skipped; the gate applies once logic exists.
skip_empty = true
