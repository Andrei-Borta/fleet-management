# Full stack in containers (demo / CD smoke test):
#   docker compose -f docker-compose.prod.yml up --build
# App is served at http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    image: ghcr.io/andrei-borta/fleet-management-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@db:5432/fleet
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: ghcr.io/andrei-borta/fleet-management-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
